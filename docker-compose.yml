version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gusto_pos_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ahad@98909
      MYSQL_DATABASE: gusto_pos

    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gusto_pos_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:ahad%4098909@db:3306/gusto_pos
      - SECRET_KEY=supersecretkeygustopos1234567890!
    ports:
      - "8001:8000"
    networks:
      default:
        aliases:
          - backend.railway.internal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gusto_pos_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
